syntax = "proto3";
package terra.ustcstaking.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/classic-terra/core/v4/x/ustcstaking/types";

enum PositionStatus {
  POSITION_STATUS_UNSPECIFIED = 0;
  POSITION_STATUS_ACTIVE = 1;
  POSITION_STATUS_UNBONDING = 2;
  POSITION_STATUS_WITHDRAWN = 3;
}

message LockTier {
  option (gogoproto.equal) = true;

  uint32 id = 1 [(gogoproto.moretags) = "yaml:\"id\""];
  google.protobuf.Duration duration = 2 [(gogoproto.stdduration) = true, (gogoproto.moretags) = "yaml:\"duration\""];
  string multiplier = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"multiplier\""
  ];
}

message Position {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  uint64 id = 1 [(gogoproto.moretags) = "yaml:\"id\""];
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString", (gogoproto.moretags) = "yaml:\"owner\""];
  cosmos.base.v1beta1.Coin principal = 3 [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"principal\""];
  string shares = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"shares\""
  ];
  uint32 lock_tier_id = 5 [(gogoproto.moretags) = "yaml:\"lock_tier_id\""];
  string share_multiplier = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"share_multiplier\""
  ];
  string reward_debt = 7 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"reward_debt\""
  ];
  google.protobuf.Timestamp unbonding_end_time = 8 [(gogoproto.stdtime) = true, (gogoproto.moretags) = "yaml:\"unbonding_end_time\""];
  PositionStatus status = 9 [(gogoproto.moretags) = "yaml:\"status\""];
  cosmos.base.v1beta1.Coin claimable_rewards = 10 [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"claimable_rewards\""];
  google.protobuf.Duration lock_duration = 11 [(gogoproto.stdduration) = true, (gogoproto.moretags) = "yaml:\"lock_duration\""];
}

message RewardState {
  string reward_index = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"reward_index\""
  ];
  string total_shares = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"total_shares\""
  ];
  string unallocated_rewards = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"unallocated_rewards\""
  ];
  string allocated_rewards = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"allocated_rewards\""
  ];
  google.protobuf.Timestamp last_reward_time = 5 [
    (gogoproto.stdtime) = true,
    (gogoproto.moretags) = "yaml:\"last_reward_time\""
  ];
  string emission_remainder = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"emission_remainder\""
  ];
  string index_remainder = 7 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"index_remainder\""
  ];
}

message Params {
  option (gogoproto.equal) = true;

  reserved 4;
  reserved "funding_authority";

  string bond_denom = 1 [(gogoproto.moretags) = "yaml:\"bond_denom\""];
  repeated LockTier lock_tiers = 2 [(gogoproto.nullable) = false, (gogoproto.moretags) = "yaml:\"lock_tiers\""];
  string authority = 3 [(cosmos_proto.scalar) = "cosmos.AddressString", (gogoproto.moretags) = "yaml:\"authority\""];
  bool paused = 5 [(gogoproto.moretags) = "yaml:\"paused\""];
  string reward_rate_per_day = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"reward_rate_per_day\""
  ];
}
