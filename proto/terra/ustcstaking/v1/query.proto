syntax = "proto3";
package terra.ustcstaking.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";
import "terra/ustcstaking/v1/ustcstaking.proto";

option go_package = "github.com/classic-terra/core/v4/x/ustcstaking/types";

service Query {
  rpc Position(QueryPositionRequest) returns (QueryPositionResponse) {
    option (google.api.http).get = "/terra/ustcstaking/v1/positions/{position_id}";
  }
  rpc PositionsByOwner(QueryPositionsByOwnerRequest) returns (QueryPositionsByOwnerResponse) {
    option (google.api.http).get = "/terra/ustcstaking/v1/owners/{owner}/positions";
  }
  rpc RewardState(QueryRewardStateRequest) returns (QueryRewardStateResponse) {
    option (google.api.http).get = "/terra/ustcstaking/v1/reward-state";
  }
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/terra/ustcstaking/v1/params";
  }
  rpc ValidateState(QueryValidateStateRequest) returns (QueryValidateStateResponse) {
    option (google.api.http).get = "/terra/ustcstaking/v1/validate-state";
  }
}

message QueryPositionRequest { uint64 position_id = 1 [(gogoproto.moretags) = "yaml:\"position_id\""]; }
message QueryPositionResponse {
  Position position = 1 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin pending_rewards = 2 [(gogoproto.nullable) = false];
}
message QueryPositionsByOwnerRequest {
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryPositionsByOwnerResponse {
  repeated Position positions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
message QueryRewardStateRequest {}
message QueryRewardStateResponse {
  RewardState reward_state = 1 [(gogoproto.nullable) = false];
  string reward_rate_per_day = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  cosmos.base.v1beta1.Coin reward_pool_balance = 3 [(gogoproto.nullable) = false];
  bool paused = 4;
  string runway_seconds = 5 [(cosmos_proto.scalar) = "cosmos.Int"];
  bool runway_defined = 6;
}
message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1 [(gogoproto.nullable) = false]; }
// ValidateState pages across position records. Each RPC is capped; callers
// needing a complete state result must follow pagination at one pinned height
// and aggregate every page, as the CLI does.
message QueryValidateStateRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryValidateStateResponse {
  // Valid covers structural/accounting validity of this page only. The CLI
  // performs global balance and active-share comparisons after aggregating all pages.
  bool valid = 1;
  string detail = 2;
  cosmos.base.query.v1beta1.PageResponse pagination = 3;
  string principal_liability = 4;
  string active_shares = 5;
  string reward_liability = 6;
  repeated cosmos.base.v1beta1.Coin principal_pool_balances = 7 [(gogoproto.nullable) = false];
  repeated cosmos.base.v1beta1.Coin reward_pool_balances = 8 [(gogoproto.nullable) = false];
  RewardState reward_state = 9 [(gogoproto.nullable) = false];
  string claimable_liability = 10 [(cosmos_proto.scalar) = "cosmos.Int"];
  string reserved_rewards = 11 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string reward_liability_exact = 12 [(cosmos_proto.scalar) = "cosmos.Dec"];
}
